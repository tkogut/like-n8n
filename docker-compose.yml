version: '3.8'

services:
  google-workflow-automation:
    build: .
    container_name: google-workflow-automation
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
